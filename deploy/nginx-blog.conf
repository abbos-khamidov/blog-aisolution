# blog.aisolution.uz — reverse proxy to the aisolution-blog PM2 process on :3002.
# Install: copy to /etc/nginx/sites-available/blog.aisolution.uz,
# symlink into sites-enabled, then: certbot --nginx -d blog.aisolution.uz
#
# Does NOT touch the aisolution (main site, :3000) or aisolution-crm (:8000)
# processes or their Nginx blocks — see nginx-crm.conf for that config.
#
# Built to survive traffic spikes (see docs/LOAD-TEST.md):
#   1. micro-cache — public pages are served by nginx for 10 s, so a thousand
#      visitors in the same second cost Node.js one render, not a thousand;
#      if Node is slow or down, the last good copy is served instead of an error
#   2. static files (/_next/static, covers, logos) cached by nginx for long
#   3. per-IP rate limits, so one client (or bot) can't flood the app
#   4. keep-alive connections to Node instead of a new TCP connection per request
#
# Before reloading:  sudo mkdir -p /var/cache/nginx/blog && sudo nginx -t
# Then:              sudo systemctl reload nginx
# Check the cache:   curl -sI https://blog.aisolution.uz/ru | grep -i x-cache   (MISS, then HIT)

# ---- shared settings (this file is included inside http {}) -----------------

upstream blog_app {
    server 127.0.0.1:3002;
    keepalive 32;
}

# "Connection: upgrade" only for real WebSocket requests; plain requests keep
# the upstream connection alive.
map $http_upgrade $blog_connection {
    default upgrade;
    ""      "";
}

proxy_cache_path /var/cache/nginx/blog levels=1:2 keys_zone=blog_cache:20m
                 max_size=1g inactive=7d use_temp_path=off;

# Rates are per IP. Generous on purpose: mobile operators put many customers
# behind one shared IP (CGNAT), so a tight limit would block real people.
# A normal visitor makes a few requests per page; an open tab pings /api/stats
# every 25 s.
limit_req_zone  $binary_remote_addr zone=blog_req:20m   rate=50r/s;
limit_req_zone  $binary_remote_addr zone=blog_stats:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=blog_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

# ---- site ---------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name blog.aisolution.uz;

    ssl_certificate /etc/letsencrypt/live/blog.aisolution.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.aisolution.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/rss+xml image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection $blog_connection;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Hashed build files never change: cache for a month in nginx, a year in browsers.
    location /_next/static/ {
        proxy_pass http://blog_app;
        proxy_cache blog_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Next already sends "public, max-age=31536000, immutable" for these.
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Images and icons from public/.
    location ~ ^/(covers|brand|authors|images)/ {
        proxy_pass http://blog_app;
        proxy_cache blog_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Live counter: never cached, its own small rate limit.
    location = /api/stats {
        limit_req zone=blog_stats burst=50 nodelay;
        proxy_pass http://blog_app;
    }

    # Admin login: slow down password guessing before it reaches the app.
    location = /api/admin/login {
        limit_req zone=blog_login burst=5 nodelay;
        proxy_pass http://blog_app;
    }

    # Other APIs and the admin panel: never cached.
    location /api/ {
        limit_req zone=blog_req burst=100 nodelay;
        proxy_pass http://blog_app;
    }

    location /admin {
        limit_req zone=blog_req burst=100 nodelay;
        proxy_pass http://blog_app;
    }

    # Public pages: 10-second micro-cache.
    location / {
        limit_req zone=blog_req burst=100 nodelay;
        limit_conn blog_conn 100;

        proxy_pass http://blog_app;
        proxy_cache blog_cache;
        # Next sends the client-navigation (RSC) variant at the same URL — keep them apart.
        proxy_cache_key "$scheme$request_method$host$request_uri|$http_rsc|$http_next_router_prefetch";
        proxy_cache_valid 200 301 302 10s;
        proxy_cache_valid 404 10s;
        # Next's own s-maxage is for CDNs; nginx uses the 10 s above.
        proxy_ignore_headers Cache-Control Expires;
        # One request refreshes an expired page; everyone else gets the previous copy meanwhile.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # A logged-in admin always sees the fresh page.
        proxy_cache_bypass $cookie_ais_admin;
        proxy_no_cache $cookie_ais_admin;
        add_header X-Cache $upstream_cache_status always;
    }
}

server {
    listen 80;
    server_name blog.aisolution.uz;
    return 301 https://$host$request_uri;
}
